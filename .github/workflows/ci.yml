name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: build & test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Termyn.slnx

      - name: Build
        run: dotnet build Termyn.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Termyn.slnx -c Release --no-build --verbosity normal
