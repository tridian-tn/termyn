name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Termyn.slnx

      - name: Build
        run: dotnet build Termyn.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Termyn.slnx -c Release --no-build

  # The projects below the UI, on a Mac. They target plain net10.0 so a native macOS client can be
  # built on them, and this is what says they still build and pass there, on Apple Silicon and
  # with the ICU region data macOS brings rather than Windows'. Termyn.Portable.slnf leaves out the
  # Windows projects: they target net10.0-windows, and their tests need a Windows desktop.
  #
  # Not something the packaging waits on. Mac support is still being built, and the Windows
  # release doesn't ship anything this job builds that the job above hasn't already tested.
  build-test-macos:
    name: build & test (macOS, portable)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Termyn.Portable.slnf

      - name: Build
        run: dotnet build Termyn.Portable.slnf -c Release --no-restore

      - name: Test
        run: dotnet test --solution Termyn.Portable.slnf -c Release --no-build

  # Alongside the tests rather than after them: it builds with -SkipTests, so waiting for the suite
  # only made every run a minute longer. The release job waits on both, so nothing is attached to a
  # release unless the suite passed too.
  package:
    name: package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # -SkipTests because the build & test job runs the suite beside this one, and running it twice
      # adds minutes for nothing. -RequireInstaller because the script falls back to the zip alone when Inno Setup
      # is missing, which is right on a laptop and wrong here: half a release, announced in a warning
      # nobody reads, is worse than a failure.
      #
      # -Version is taken from the tag when there is one and left off otherwise, so a tag push
      # names the artefacts and stamps the assembly with the tag. On a branch or a PR they come out
      # as the 0.0.0 placeholder from the props, which is all a packaging check needs.
      #
      # The runner image ships Inno Setup 6 under Program Files (x86), which is one of the three
      # places the script looks, so nothing is installed for it. That is the part of this worth
      # watching on the first run.
      - name: Build the artefacts
        shell: pwsh
        run: |
          # Read from the environment rather than templated into the script — a tag name that git
          # accepts can contain a single quote, and interpolating it into '' would break parsing.
          # Not $args either, which is the automatic PowerShell name for a function's arguments.
          $buildArgs = @('-SkipTests', '-RequireInstaller')
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $buildArgs += @('-Version', $env:GITHUB_REF_NAME.TrimStart('v'))
          }
          pwsh -File ./packaging/build.ps1 @buildArgs

      # Named rather than globbed at the directory, so the publish folder underneath doesn't come
      # too — that is the unpackaged app, and it is what both of these are made of.
      - name: Keep them
        uses: actions/upload-artifact@v7
        with:
          name: termyn-artefacts
          if-no-files-found: error
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip

  release:
    name: release
    runs-on: windows-latest
    needs: [ build-test, package ]
    if: startsWith(github.ref, 'refs/tags/v')

    # Only this job, and only on a tag. The packaging above runs on every pull request, including
    # ones from forks, and has no business being able to write to the repository.
    permissions:
      contents: write

    steps:
      - name: Take the artefacts the packaging job built
        uses: actions/download-artifact@v8
        with:
          name: termyn-artefacts
          path: artifacts

      # The packaging job stamps both filenames and the assembly with the tag, so the tag and the
      # artefacts agree by construction. This is here to catch that packaging didn't drop one of
      # them silently — half a release, downloaded by whoever clicked the link first, is worse than
      # one that stops here.
      - name: Check both artefacts are here
        shell: pwsh
        run: |
          # Off the environment, not templated into the script — same reasoning as the packaging job.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $missing = @('setup.exe', 'portable.zip') |
            ForEach-Object { Join-Path 'artifacts' "Termyn-$version-$_" } |
            Where-Object { -not (Test-Path $_) }

          if ($missing) {
            $built = (Get-ChildItem artifacts | ForEach-Object Name) -join ', '
            throw "Expected $($missing -join ', '), got: $built"
          }

      # Drafted rather than published: these are unsigned, so somebody should look before they are
      # downloadable. Delete the draft to abandon a release, or press the button to make it real. A
      # release that already exists for this tag is attached to as it stands.
      - name: Attach them to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

          # Which repository, told rather than worked out. gh otherwise asks git, and this job has
          # no checkout to ask — only the artefacts the packaging job built. Without this every one
          # of the commands below fails with "not a git repository", on a tag, which is the worst
          # place to find it.
          GH_REPO: ${{ github.repository }}
        run: |
          # Off the environment, not templated into the script — same reasoning as above.
          $tag = $env:GITHUB_REF_NAME

          # gh exits non-zero when there's no release yet, which is the ordinary case here rather
          # than a failure. Whether a non-zero native command becomes a terminating error under
          # this shell's ErrorActionPreference has changed between PowerShell versions, so the
          # answer is taken from what gh printed instead of from how it exited — that reads the
          # same either way. Anything else going wrong leaves this empty too, and the create
          # below then fails loudly, which is the right end for it.
          $existing = $null
          try { $existing = gh release view $tag --json tagName 2>$null } catch { }

          if (-not $existing) {
            gh release create $tag --draft --title "Termyn $tag" --generate-notes
          }

          gh release upload $tag (Get-ChildItem artifacts/*-setup.exe, artifacts/*-portable.zip) --clobber
